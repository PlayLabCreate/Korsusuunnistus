<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Korsu Challenge – Testiversio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { font-family: Arial; background:#0f1a0f; color:#e6e6e6; margin:0 }
header { background:#1c2b1c; padding:20px; text-align:center; font-size:24px; font-weight:bold; border-bottom:3px solid #3a5f3a }
#startScreen { text-align:center; padding:30px }
#startScreen input { padding:12px; width:80%; font-size:18px; border-radius:8px; border:none; margin-top:20px; text-align:center }
#map { height:300px; width:100%; display:none }
#game { padding:20px; display:none }
.button { background:#3a5f3a; padding:12px; margin:10px 0; border-radius:8px; text-align:center; cursor:pointer; font-size:18px }
.button:hover { background:#4c7a4c }
.option { background:#2a3d2a; padding:15px; margin:10px 0; border:2px solid #3a5f3a; border-radius:8px; cursor:pointer; font-size:18px; text-align:center }
.option:hover { background:#3a5f3a }
#result { margin-top:20px; font-size:22px; font-weight:bold; text-align:center }
img { width:90%; border:3px solid #3a5f3a; border-radius:10px; margin-top:20px }
</style>
</head>

<body>

<header>Korsu Challenge – Testiversio</header>

<div id="startScreen">
    <h2>Kotitesti</h2>
    <p>Syötä ryhmän nimi aloittaaksesi:</p>
    <input id="teamNameInput" type="text" placeholder="Ryhmän nimi">
    <div class="button" onclick="startGame()">Aloita testi</div>
</div>

<div id="map"></div>

<div id="game">
    <h2 id="teamNameDisplay"></h2>
    <h3>Rastit avautuvat 5 m säteellä</h3>
    <div id="rastiView"></div>
    <div id="result"></div>
</div>

<script>
let teamName="";
let savedShelterPhoto=null;
let savedEvacPhoto=null;
let score=0;
let startTime=0;

let answerR1="";
let answerR3=[];
let answerR5="";

let compassAnswer="";
let compassChoice="";
let routeDirection=null;

let map;
let markerLayer;
let playerMarker=null;

let openedRasti = null;

const forwardOrder=[1,2,3,4,5,6];
const reverseOrder=[6,5,4,3,2,1];
let visibleRastit=[1,6];

const rastit=[
    {id:1, lat:62.457230, lon:25.965059},
    {id:2, lat:62.457255, lon:25.964528},
    {id:3, lat:62.457040, lon:25.964372},
    {id:4, lat:62.456971, lon:25.964184},
    {id:5, lat:62.456958, lon:25.964546},
    {id:6, lat:62.456963, lon:25.964887}
];

function startGame(){
    const input=document.getElementById("teamNameInput").value.trim();
    if(input.length<2){ alert("Anna ryhmän nimi."); return; }
    teamName=input;
    startTime=Date.now();
    document.getElementById("startScreen").style.display="none";
    document.getElementById("map").style.display="block";
    document.getElementById("game").style.display="block";
    document.getElementById("teamNameDisplay").innerHTML="Ryhmä: "+teamName;
    initMap();
    startGeolocation();
}

function initMap(){
    map=L.map('map').setView([62.45715,25.96470],19);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    markerLayer=L.layerGroup().addTo(map);
    updateMapMarkers();
}

function updateMapMarkers(){
    markerLayer.clearLayers();
    visibleRastit.forEach(id=>{
        const r=rastit.find(x=>x.id===id);
        if(r){ L.marker([r.lat,r.lon]).addTo(markerLayer).bindPopup("Rasti "+r.id); }
    });
}

function startGeolocation(){
    navigator.geolocation.watchPosition(onPosition,onGeoError,{
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
    });
}

function onPosition(pos){
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;

    if(!playerMarker){
        playerMarker=L.circleMarker([lat,lng],{
            radius:10,
            color:"#3399ff",
            fillColor:"#3399ff",
            fillOpacity:0.9
        }).addTo(map);
    } else {
        playerMarker.setLatLng([lat,lng]);
    }

    checkRastiDistance(lat,lng);
}

function onGeoError(err){
    alert("GPS-virhe: "+err.message);
}

function distanceMeters(lat1,lon1,lat2,lon2){
    const R=6371000;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function checkRastiDistance(lat,lng){
    visibleRastit.forEach(id=>{
        const r=rastit.find(x=>x.id===id);
        const d=distanceMeters(lat,lng,r.lat,r.lon);
        if(d<=5){ openRasti(id); }
    });
}

function openRasti(id){
    result.innerHTML = "";

    if (openedRasti === id) return;
    openedRasti = id;

    if(routeDirection===null){
        if(id===1)routeDirection="forward";
        if(id===6)routeDirection="reverse";
    }
    if(id===1)renderRasti1();
    if(id===2)renderRasti2();
    if(id===3)renderRasti3();
    if(id===4)renderRasti4();
    if(id===5)renderRasti5();
    if(id===6)renderRasti6();
}

function completeRasti(id){
    openedRasti = null;

    let next=null;
    if(routeDirection==="forward"){
        const i=forwardOrder.indexOf(id);
        next=forwardOrder[i+1];
    }
    if(routeDirection==="reverse"){
        const i=reverseOrder.indexOf(id);
        next=reverseOrder[i+1];
    }

    if (!next) {
        showFinalScreen();
        return;
    }

    visibleRastit=[next];
    updateMapMarkers();
    rastiView.innerHTML = `<p>Tehtävä suoritettu. Jatka seuraavalle rastille.</p>`;
}

function renderRasti1(){
    rastiView.innerHTML=`
        <h2>Rasti 1 – Tajuttomuus</h2>
        <p>Kuinka tunnistat onko henkilö tajuton?</p>
        <div class="option" onclick="saveR1('Tajuton henkilö ei reagoi ääneen, kosketukseen tai herättelyyn. Hengitys on äänetöntä ja tasaista, lihasjäntevyys puuttuu.', true)">Tajuton henkilö ei reagoi ääneen, kosketukseen tai herättelyyn...</div>
        <div class="option" onclick="saveR1('Hän puhuu sekavasti', false)">Hän puhuu sekavasti</div>
        <div class="option" onclick="saveR1('Hän juoksee karkuun', false)">Hän juoksee karkuun</div>
        <div class="option" onclick="saveR1('Hän valittaa kipua', false)">Hän valittaa kipua</div>`;
}

function saveR1(text, correct){
    answerR1=text;
    if(correct) score++;
    completeRasti(1);
}

function renderRasti2(){
    rastiView.innerHTML=`
        <h2>Rasti 2 – Rakentakaa hätämajoitus</h2>
        <p>Ottakaa kuva hätämajoituksesta.</p>
        <input type="file" accept="image/*" capture="environment" onchange="saveShelterPhoto(event)">`;
}

function saveShelterPhoto(event){
    const file=event.target.files[0];
    const reader=new FileReader();
    reader.onload=e=>{
        savedShelterPhoto=e.target.result;
        completeRasti(2);
    };
    reader.readAsDataURL(file);
}

function renderRasti3(){
    rastiView.innerHTML=`
        <h2>Rasti 3 – Pukeutuminen retkellä</h2>
        <p>Retkeillessä tärkeintä pukeutumisessa on?</p>

        <label><input type="checkbox" id="r3_1"> Hienot vaatteet</label><br>
        <label><input type="checkbox" id="r3_2"> Vedenpitävyys</label><br>
        <label><input type="checkbox" id="r3_3"> Kerrospukeutuminen</label><br>
        <label><input type="checkbox" id="r3_4"> Kestävyys</label><br>

        <div class="button" onclick="saveR3()">Tallenna vastaus</div>`;
}

function saveR3(){
    const v1=document.getElementById("r3_1").checked;
    const v2=document.getElementById("r3_2").checked;
    const v3=document.getElementById("r3_3").checked;
    const v4=document.getElementById("r3_4").checked;

    answerR3=[];
    if(v1) answerR3.push("Hienot vaatteet");
    if(v2) answerR3.push("Vedenpitävyys");
    if(v3) answerR3.push("Kerrospukeutuminen");
    if(v4) answerR3.push("Kestävyys");

    if(!v1 && v2 && v3 && v4) score++;

    completeRasti(3);
}

function renderRasti4(){
    rastiView.innerHTML=`
        <h2>Rasti 4 – Evakuointi</h2>
        <p>Ottakaa kuva evakuoinnista.</p>
        <input type="file" accept="image/*" capture="environment" onchange="saveEvacPhoto(event)">`;
}

function saveEvacPhoto(event){
    const file=event.target.files[0];
    const reader=new FileReader();
    reader.onload=e=>{
        savedEvacPhoto=e.target.result;
        completeRasti(4);
    };
    reader.readAsDataURL(file);
}

function renderRasti5(){
    rastiView.innerHTML=`
        <h2>Rasti 5 – Nuotion paikka</h2>
        <p>Mihin on turvallinen paikka tehdä nuotio?</p>
        <div class="option" onclick="saveR5('Puiden alle', false)">Puiden alle</div>
        <div class="option" onclick="saveR5('Kallion kolo', true)">Kallion kolo</div>
        <div class="option" onclick="saveR5('Pelto', false)">Pelto</div>
        <div class="option" onclick="saveR5('Rakennuksen seinusta', false)">Rakennuksen seinusta</div>`;
}

function saveR5(text, correct){
    answerR5=text;
    if(correct) score++;
    completeRasti(5);
}

function renderRasti6(){
    rastiView.innerHTML=`
        <h2>Rasti 6 – Tee itse kompassi</h2>
        <p>Selitä omin sanoin, kuinka rakennat kompassin.</p>
        <textarea id="compassInput" style="width:100%;height:150px;font-size:16px;padding:10px;border-radius:8px;"></textarea>
        <h3>Kumpi neulan pää on pohjoinen?</h3>
        <div class="option" onclick="selectCompassChoice('correct')">Luonnonmerkit: sammal pohjoisessa, oksat etelässä...</div>
        <div class="option" onclick="selectCompassChoice('wrong')">Tuulen suunta</div>
        <div class="option" onclick="selectCompassChoice('wrong')">Neulan kiilto</div>
        <div class="option" onclick="selectCompassChoice('wrong')">Ruuvi vertailuna</div>
        <div class="button" onclick="saveCompassAnswer()">Tallenna vastaus</div>`;
}

function selectCompassChoice(choice){
    compassChoice=choice;
}

function saveCompassAnswer(){
    compassAnswer=document.getElementById("compassInput").value.trim();
    if(compassChoice==="correct") score++;
    completeRasti(6);
}

function showFinalScreen(){
    const endTime=Date.now();
    const totalSeconds=Math.floor((endTime-startTime)/1000);
    const minutes=Math.floor(totalSeconds/60);
    const seconds=totalSeconds%60;

    rastiView.innerHTML=`
        <h2>Loppunäkymä</h2>
        <h3>Ryhmä: ${teamName}</h3>
        <p>Suoritusaika: ${minutes} min ${seconds} s</p>
        <p>Pisteet: ${score}</p>

        <h3>Rasti 1 – Tajuttomuus</h3>
        <p>${answerR1}</p>

        <h3>Rasti 2 – Hätämajoitus</h3>
        ${savedShelterPhoto?`<img src="${savedShelterPhoto}">`:"Ei kuvaa"}

        <h3>Rasti 3 – Pukeutuminen</h3>
        <p>${answerR3.join(", ")}</p>

        <h3>Rasti 4 – Evakuointi</h3>
        ${savedEvacPhoto?`<img src="${savedEvacPhoto}">`:"Ei kuvaa"}

        <h3>Rasti 5 – Nuotion paikka</h3>
        <p>${answerR5}</p>

        <h3>Rasti 6 – Kompassi</h3>
        <p>${compassAnswer}</p>
        <p>${compassChoice==="correct"?"✔️ Oikein":"❌ Väärin"}</p>

        <h2>Palaa veljeskorsulle</h2>
    `;
}
</script>

</body>
</html>
